{% extends 'panel/base.html' %}{% block titulo %}Ingresar · Sistema Facturación{% endblock %}
{% block contenido %}<div class="login"><div class="card"><h1>Sistema Facturación</h1><p class="sub">Contratos y facturación · Grupo Inverco</p>
<form method="post">{% csrf_token %}{% if error %}<div class="msg error">{{ error }}</div>{% endif %}
<p><label class="small muted">Usuario</label><br><input type="text" name="username" autofocus autocomplete="username" autocapitalize="none" style="width:100%"></p>
<p><label class="small muted">Clave</label><br><input type="password" name="password" autocomplete="current-password" style="width:100%"></p>
<input type="hidden" name="next" value="{{ next }}"><button class="btn" style="width:100%">Ingresar</button></form></div></div>{% endblock %}
